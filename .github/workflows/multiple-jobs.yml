name: Arquivos compartilhados entre jobs

on:
    workflow_dispatch:

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Confere versão do ubuntu
        run: cat /etc/os-release

      - name: Exibir mensagem
        run: echo "Estou exibindo uma mensagem aleatória para entender como funciona o workflow usando github Actions" > ${{ github.workspace }}/mensagem.txt
      - name: Lê o conteúdo do arquivo
        run: cat mensagem.txt 

      - uses: actions/upload-artifact@v7
        with:

          name: strigus-upload
          path: ${{ github.workspace }}/mensagem.txt

  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: Ver o conteudo do diretorio
        run: ls -lha

      - uses: actions/download-artifact@v4
        with:
          name: strigus-upload
          path: strigus

      - name: Ver o conteudo do diretorio
        run: ls -lha && ls ./strigus/

      - name: Acessa arquivo mensagem
        run: mv strigus/mensagem.txt . && rm -rf ./strigus 

      - name: Ver o conteudo do diretorio
        run: ls -lha

      - name: Acessa arquivo mensagem
        run: cat mensagem.txt