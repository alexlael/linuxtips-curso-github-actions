name: First Workflow LinuxTips

on:
  push:
    branches:
      - main

jobs:
  giropops:
    runs-on: ubuntu-latest
    steps:
      - name: Confere versão do ubuntu
        run: cat /etc/os-release

      - name: Exibir mensagem
        run: echo "Estou exibindo uma mensagem aleatória para entender como funciona o workflow usando github Actions" > mensagem.txt

      - name: Outro passo
        run: ls -lha

      - name: Lê o conteúdo do arquivo
        run: cat mensagem.txt  
